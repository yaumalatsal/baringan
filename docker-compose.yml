services:
  app:
    build: .
    container_name: baringan-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - baringan-storage:/var/www/storage
      - baringan-db:/var/www/database
    expose:
      - "9000"

  nginx:
    image: nginx:1.27-alpine
    container_name: baringan-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
      - baringan-storage:/var/www/storage:ro
    depends_on:
      - app

volumes:
  baringan-storage:
  baringan-db:
